<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WedPlan API Server</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      max-width: 480px;
      width: 90%;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      margin-bottom: 1rem;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin: 0 0 1.5rem 0;
    }
    .btn {
      display: inline-block;
      background: #e11d48;
      color: white;
      text-decoration: none;
      padding: 0.65rem 1.25rem;
      border-radius: 0.5rem;
      font-weight: 500;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #be123c;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Online</div>
    <h1>💍 WedPlan API Server</h1>
    <p>The backend API for WedPlan Wedding Planning Platform is running smoothly on Vercel.</p>
    <a href="/api/health" class="btn">View API Health Status</a>
  </div>
</body>
</html>
